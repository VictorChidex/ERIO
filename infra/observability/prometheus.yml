# Prometheus for the local "obs" profile (spec section 10). Staging and
# production use the same scrape targets and alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  # Request counts and latency, per API process.
  - job_name: api
    static_configs: [{ targets: ["api:8000"] }]
  # Crawl, index and queue metrics, read from Postgres and Redis.
  - job_name: pipeline
    scrape_interval: 30s
    static_configs: [{ targets: ["metrics:9108"] }]
