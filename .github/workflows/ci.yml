# CI for every push and pull request. Any failed job blocks the merge once
# branch protection on `main` requires these checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - name: Credential-word check (D-08)
        run: bash scripts/check-credential-words.sh
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: gitleaks
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Real Postgres and Redis for the database tests, which must run here (not skip).
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: erio
          POSTGRES_DB: erio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erio -d erio"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.18.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      ERIO_TEST_DATABASE_URL: postgresql://erio@127.0.0.1:5432/erio
      ERIO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ERIO_TEST_OPENSEARCH_URL: http://127.0.0.1:9200
      ERIO_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # Known vulnerabilities in the locked Python dependencies.
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --all-packages --no-dev --no-emit-workspace --no-hashes -o requirements-audit.txt
          uvx pip-audit==2.10.1 -r requirements-audit.txt --progress-spinner off
      # Every alert fires on its drill series, and the monitoring configs load.
      - name: Alert rules and monitoring config
        run: |
          docker run --rm -v "$PWD/infra/observability:/c:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 test rules /c/alerts.test.yml
          docker run --rm -v "$PWD/infra/observability:/c:ro" --entrypoint promtool \
            prom/prometheus:v3.15.1 check config /c/prometheus.yml
          docker run --rm -v "$PWD/infra/observability:/c:ro" --entrypoint amtool \
            prom/alertmanager:v0.34.1 check-config /c/alertmanager.yml
          python3 -c "import json, glob; [json.load(open(f)) for f in glob.glob('infra/observability/grafana/dashboards/*.json')]"

  web:
    name: Website (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Known vulnerabilities in what the site ships (dev tools are triaged weekly).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  stack:
    name: Local stack (docker compose)
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every service except beat: CI never crawls the live job boards.
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 420 api worker web mcp metrics
      # Images: no fixable high or critical vulnerability, no credential baked in
      # (Trivy scans for both by default).
      - name: Image scan (Trivy)
        run: |
          for image in erio-python:local erio-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
              image --quiet --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "$image"
          done
      - name: Check the services answer
        run: |
          curl -sSf http://127.0.0.1:8000/v1/health/ready
          test "$(docker compose exec -T postgres psql -U erio -d erio -tAc 'select version_num from alembic_version')" = "$(docker compose run --rm --no-deps migrate alembic -c packages/core/alembic.ini heads | cut -d' ' -f1)"
          docker compose exec -T api python -c \
            "from erio_ingest.worker import ping; assert ping.delay().get(timeout=30) == 'pong'"
          # Raw payloads are files on the raw-data volume: the worker's user can write and read one.
          docker compose exec -T worker python -c             "from erio_core.settings import get_settings; from erio_ingest.storage import FileRawStore, make_store; store = make_store(get_settings()); assert isinstance(store, FileRawStore); store.put_bytes('ci/probe', b'ok'); assert store._path('ci/probe').read_bytes() == b'ok'"
          curl -sSf http://127.0.0.1:3000/ | grep -q 'jobs indexed'
          docker compose exec -T metrics python -c \
            "import urllib.request; assert b'erio_queue_backlog' in urllib.request.urlopen('http://localhost:9108/metrics').read()"
      # Known jobs from the recorded fixtures, run through the real pipeline
      # (crawl, normalize, index) with no network.
      - name: Load demo jobs
        run: |
          docker compose run --rm --no-deps -v "$PWD/fixtures:/app/fixtures:ro" worker \
            python -m erio_ingest.demo /app/fixtures
          # Moniepoint's recorded board has two Nigerian jobs.
          curl -sSf "http://127.0.0.1:8000/v1/jobs?country=NG" | grep -q '"total":2,'
      # The same search through the MCP server, as an assistant would make it.
      - name: Search through the MCP server
        run: |
          curl -sSf http://127.0.0.1:8100/mcp             -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream'             -H 'MCP-Protocol-Version: 2025-06-18'             -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "search_jobs", "arguments": {"countries": ["NG"], "include_worldwide": false}}}'             | grep -q '"total":2,'
          curl -sSf http://127.0.0.1:8100/tools/openai.json | grep -q '"name":"search_jobs"'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests (Playwright, desktop and 360 px)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
