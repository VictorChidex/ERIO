# CI for every push and pull request. Any failed job blocks the merge once
# branch protection on `main` requires these checks.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-scan:
    name: Credential scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - name: Credential-word check (D-08)
        run: bash scripts/check-credential-words.sh
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: gitleaks
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Real Postgres and Redis for the database tests, which must run here (not skip).
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: erio
          POSTGRES_DB: erio
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erio -d erio"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.18.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      ERIO_TEST_DATABASE_URL: postgresql://erio@127.0.0.1:5432/erio
      ERIO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      ERIO_TEST_OPENSEARCH_URL: http://127.0.0.1:9200
      ERIO_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Website (lint, types, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  stack:
    name: Local stack (docker compose)
    needs: [python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every service except beat: CI never crawls the live job boards.
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 420 api worker web s3
      - name: Check the services answer
        run: |
          curl -sSf http://127.0.0.1:8000/v1/health/ready
          test "$(docker compose exec -T postgres psql -U erio -d erio -tAc 'select version_num from alembic_version')" = "$(docker compose run --rm --no-deps migrate alembic -c packages/core/alembic.ini heads | cut -d' ' -f1)"
          docker compose exec -T api python -c \
            "from erio_ingest.worker import ping; assert ping.delay().get(timeout=30) == 'pong'"
          curl -sSf http://127.0.0.1:9090/ | grep -q '<Name>erio-raw</Name>'
          curl -sSf http://127.0.0.1:3000/ | grep -q 'API online'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend tests (Playwright, desktop and 360 px)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
