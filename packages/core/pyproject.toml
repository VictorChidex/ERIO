[project]
name = "erio-core"
version = "0.1.0"
description = "Shared models and configuration used by every ERIO Python service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_core"]
