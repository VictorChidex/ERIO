[project]
name = "erio-core"
version = "0.1.0"
description = "Shared models and configuration used by every ERIO Python service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "nh3>=0.2",
    "opensearch-py>=2.7",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_core"]
