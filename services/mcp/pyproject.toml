[project]
name = "erio-mcp"
version = "0.1.0"
description = "ERIO's read-only MCP server: AI assistants search ERIO jobs as a tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "erio-core",
    "httpx>=0.27",
    "mcp>=1.20",
]

[tool.uv.sources]
erio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_mcp"]
