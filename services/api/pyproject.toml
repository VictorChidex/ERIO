[project]
name = "erio-api"
version = "0.1.0"
description = "ERIO public REST API (/v1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4",
    "defusedxml>=0.7.1",
    "erio-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "psycopg[binary]>=3.2",
    "pypdf>=7.0.1",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
erio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_api"]
