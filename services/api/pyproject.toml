[project]
name = "erio-api"
version = "0.1.0"
description = "ERIO public REST API (/v1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "erio-core",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
erio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_api"]
