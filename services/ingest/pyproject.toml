[project]
name = "erio-ingest"
version = "0.1.0"
description = "ERIO crawl scheduler and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "erio-core",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "boto3>=1.35",
    "redis>=5.2",
]

[tool.uv.sources]
erio-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erio_ingest"]
